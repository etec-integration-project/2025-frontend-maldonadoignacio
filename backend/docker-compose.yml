version: '3.8'

services:
  frontend:
    build: ../frontend
    ports:
      - "8080:8080"  # Puerto local
      - "0.0.0.0:3001:8080"  # Cambiado a 3001 para network
    environment:
      - VUE_APP_API_URL=http://localhost:4000
      - HOST=0.0.0.0
    volumes:
      - ../frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/proyecto
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
    
  mongodb:
    image: mongo:latest
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: 